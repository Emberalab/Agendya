<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- vite-plugin-pwa injects <link rel="manifest"> automatically at build
         time; these three tags are the part it does NOT add for us: iOS only
         treats the site as an installable/standalone app with the explicit
         apple-mobile-web-app-* tags below (its own manifest support is
         partial), and theme-color colors the browser/status bar chrome. Keep
         this in sync with `theme_color` in vite.config.ts. -->
    <meta name="theme-color" content="#4F46E5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Agendya" />
    <title>agendya</title>
    <meta
      name="description"
      content="Agendya es la plataforma de reservas online para barberías y peluquerías: tu propia página de reservas, gestión de servicios y horarios, y confirmación automática de citas."
    />
    <!--
      Fonts are loaded here rather than via `@import url(...)` inside main.scss:
      a CSS @import is only discovered after the app stylesheet has downloaded
      and parsed, then serializes three more round trips before the first font
      request — a measurable hit to First Contentful Paint. As <link> tags in
      the head the browser starts them immediately, in parallel with the bundle,
      as one combined css2 request. Keep the families/weights in sync with the
      `@theme` block in src/styles/tailwind.css.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
    <script>
      // Applies the theme before first paint so switching to dark mode never
      // flashes light first. Mirrors the persisted-state shape written by
      // zustand's `persist` middleware in shared/theme/themeStore.ts (same
      // storage key, `{ state: { manualTheme } }`) — keep the two in sync.
      // No stored `manualTheme` (or none yet) means the user never overrode
      // the OS preference, so `prefers-color-scheme` decides.
      (function () {
        try {
          var stored = localStorage.getItem('agendya-theme');
          var theme = stored ? JSON.parse(stored).state.manualTheme : null;
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.dataset.theme = theme;
          if (theme === 'dark') {
            document.documentElement.classList.add('dark-theme');
          }
        } catch (e) {
          /* localStorage unavailable (privacy mode, etc.) — default light theme applies. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
