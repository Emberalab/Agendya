<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agendya</title>
    <script>
      // Applies the theme before first paint so switching to dark mode never
      // flashes light first. Mirrors the persisted-state shape written by
      // zustand's `persist` middleware in shared/theme/themeStore.ts (same
      // storage key, `{ state: { theme } }`) — keep the two in sync.
      (function () {
        try {
          var stored = localStorage.getItem('agendya-theme');
          var theme = stored ? JSON.parse(stored).state.theme : null;
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.dataset.theme = theme;
          if (theme === 'dark') {
            document.documentElement.classList.add('dark-theme');
          }
        } catch (e) {
          /* localStorage unavailable (privacy mode, etc.) — default light theme applies. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
