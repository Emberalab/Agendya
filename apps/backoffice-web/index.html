<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Same brand color as apps/web's theme-color (keep the two in sync). -->
    <meta name="theme-color" content="#4F46E5" />
    <title>Agendya Backoffice</title>
    <meta
      name="description"
      content="Backoffice interno de Agendya: soporte, gestión de profesionales y auditoría para el equipo de Agendya."
    />
    <meta name="robots" content="noindex, nofollow" />
    <!--
      Same three families as apps/web (Outfit / Plus Jakarta Sans / Inter),
      loaded the same way — as <link> tags so the browser starts the request
      immediately instead of waiting on the stylesheet to parse. Keep the
      families/weights in sync with the `@theme` block in
      src/styles/tailwind.css.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
    <script>
      // Applies the theme before first paint so switching to dark mode never
      // flashes light first. Same mechanism as apps/web's index.html, mirrors
      // the shape zustand's `persist` middleware writes in
      // shared/theme/themeStore.ts (own storage key — keep the two in sync).
      // No stored `manualTheme` (or none yet) means the user never overrode
      // the OS preference, so `prefers-color-scheme` decides.
      (function () {
        try {
          var stored = localStorage.getItem('agendya-backoffice-theme');
          var theme = stored ? JSON.parse(stored).state.manualTheme : null;
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          /* localStorage unavailable (privacy mode, etc.) — default light theme applies. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
