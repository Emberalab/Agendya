name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agendya
          POSTGRES_PASSWORD: agendya_ci_password
          POSTGRES_DB: agendya_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agendya"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://agendya:agendya_ci_password@localhost:5432/agendya_ci?schema=public
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 7d
      SLOT_GRID_MINUTES: 15
      PORT: 4000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run database migrations
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Unit tests
        run: npm run test

      - name: Backend e2e tests
        run: npm run test:e2e
        working-directory: apps/api

      - name: Build
        run: npm run build

  web-e2e:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run test:e2e:install --workspace apps/web

      # The E2E suite stubs the Agendya API at the network boundary and lets
      # Playwright start the Vite dev server, so no Postgres/backend is needed.
      - name: Run Playwright tests
        run: npm run test:e2e --workspace apps/web

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
