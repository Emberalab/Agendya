name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ronda
          POSTGRES_PASSWORD: ronda_ci_password
          POSTGRES_DB: ronda_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ronda"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://ronda:ronda_ci_password@localhost:5432/ronda_ci?schema=public
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 7d
      SLOT_GRID_MINUTES: 15
      PORT: 4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run database migrations
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Unit tests
        run: npm run test

      - name: Backend e2e tests
        run: npm run test:e2e
        working-directory: apps/api

      - name: Build
        run: npm run build
