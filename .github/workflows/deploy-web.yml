name: Deploy web to GoDaddy

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/web/**'
      - 'packages/types/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: web-ftp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ github.ref == 'refs/heads/main' && 'https://api.agendya.co' || 'https://agendya-dev.up.railway.app' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build --workspace apps/web

      - name: Upload dist via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ github.ref == 'refs/heads/main' && secrets.FTP_USERNAME || secrets.FTP_USERNAME_DEV }}
          password: ${{ github.ref == 'refs/heads/main' && secrets.FTP_PASSWORD || secrets.FTP_PASSWORD_DEV }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./apps/web/dist/
          # FTP account home = Document Root of app.agendya.co or app-dev.agendya.co.
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/cgi-bin/**
            **/.well-known/**
            **/.ftpquota
