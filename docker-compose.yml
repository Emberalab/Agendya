version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agendya-postgres
    restart: always
    environment:
      POSTGRES_USER: agendya
      POSTGRES_PASSWORD: agendya_dev_password
      POSTGRES_DB: agendya_dev
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
